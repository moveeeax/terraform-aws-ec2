# Monthly, with patch and minor updates grouped into one PR each; majors
# come one per PR. Patch PRs merge themselves once CI passes
# (dependabot-auto-merge.yml).
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      patch:
        update-types: [patch]
      minor:
        update-types: [minor]
